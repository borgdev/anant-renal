id: adhd-vanderbilt-screening
version: 1.0.0
packId: primary-care-deep
displayName: "ADHD Vanderbilt Screening"
description: >
  Vanderbilt teacher + parent screener with follow-up.
scope: facility
trigger:
  kind: event
  eventType: referral.received:adhd
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact
plan:
  type: sequence
  children:
    - type: step
      step:
        id: schedule-vanderbilt
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: summarize
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: plan-followup
        skill: llm.call
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: primary-care
  lifecycleStage: active-care
  domain: pediatric
