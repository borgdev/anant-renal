id: tcm-eligibility
version: 1.0.0
packId: primary-care-deep
displayName: "TCM Eligibility Tracker (99495/99496)"
description: >
  Identifies TCM eligible discharges + coordinates 14/7-day contact.
scope: facility
trigger:
  kind: event
  eventType: discharge.completed
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact
plan:
  type: sequence
  children:
    - type: step
      step:
        id: pull-discharge
        skill: sql.query
        inputs: {}
    - type: step
      step:
        id: plan-contact
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: notify-clinician
        skill: http.call
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: primary-care
  lifecycleStage: transition-of-care
  domain: billing
