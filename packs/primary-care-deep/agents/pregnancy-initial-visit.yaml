id: pregnancy-initial-visit
version: 1.0.0
packId: primary-care-deep
displayName: "Prenatal Initial Visit Planner"
description: >
  Composes initial prenatal visit checklist + orders.
scope: facility
trigger:
  kind: event
  eventType: pregnancy.confirmed
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact
plan:
  type: sequence
  children:
    - type: step
      step:
        id: pull-history
        skill: sql.query
        inputs: {}
    - type: step
      step:
        id: compose-plan
        skill: llm.call
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: primary-care
  lifecycleStage: active-care
  domain: womens-health
