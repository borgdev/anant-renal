# Generated by scripts/generate-pack-manifests.ts from the runtime descriptor.
# Regenerate rather than hand-editing: manifestDrift compares this file to the
# descriptor in index.ts, and the descriptor is what the registry resolves.

id: care-management
version: 0.1.0
entry: index.ts
extends:
  - id: healthcare-core
    version_range: '^0.2.0'
applies_to:
  organization_kinds: [provider, payer, health-system]
capabilities:
  - care-plan-management
  - transitions-of-care
  - referral-tracking
  - appointment-management
  - medication-reconciliation
cms_universe: []
required_controls:
  - access-policy
  - audit-provenance
  - data-quality
  - sla-monitor

# A specialty block that declares exactly one thing: participation in a cross-pack
# workflow. The pack ships no ontology, measures or lens, and inventing those here
# would turn "declares nothing else" into a claim. Declaring only what exists is
# the reason the conformance matrix can be trusted when it says a pack is partial.
specialty:
  workflows:
    - id: x:hospitalization->payer-auth
      cross_pack_with: [dialysis-provider, payer]
