# The identity fields below are generated by scripts/generate-pack-manifests.ts
# from the runtime descriptor. The `specialty:` block at the end is AUTHORED,
# because the descriptor is a DomainPack and carries no specialty sections —
# identity comes from the descriptor (so drift is zero by construction), the
# declared surface comes from here (so it is a claim someone made).
#
# Regenerate the identity fields rather than hand-editing them: manifestDrift
# compares them to the descriptor in index.ts, and the descriptor is what the
# registry resolves.

id: oncology-provider
version: 0.1.0
entry: index.ts
extends:
  - id: healthcare-core
    version_range: '^0.2.0'
applies_to:
  organization_kinds: [provider, health-system]
  facility_kinds: [infusion-center, outpatient-oncology, inpatient-oncology]
capabilities:
  - treatment-plan-management
  - chemo-cycle-tracking
  - toxicity-monitoring
  - tumor-board
  - survivorship
  - prior-auth-coordination
cms_universe:
  - id: cms:mips
    title: MIPS
    authority: CMS
  - id: cms:enhancing-oncology-model
    title: 'Enhancing Oncology Model (EOM)'
    authority: CMS
required_controls:
  - access-policy
  - audit-provenance
  - data-quality
  - toxicity-alerting
  - prior-auth-coordination

# ── specialty surface (platform contract v1) ──────────────────────────────
#
# The pack was installed and declared NOTHING, so the console could not distinguish
# "installed and idle" from "absent". Declaring the surface is what makes it a
# specialty rather than a dependency that loads.
specialty:
  ontology:
    id: oncology-core
    version: 0.1.0
    # The concepts the pack's own TypeScript already models — `OncologyTreatmentPlan`
    # and `ToxicityAssessment` — named through the contract rather than only in code.
    concepts:
      - oncology.treatment-plan
      - oncology.treatment-intent
      - oncology.cycle
      - oncology.toxicity-assessment
      - oncology.ctcae-grade

  # GENERIC canonical types on purpose. There is no oncology event in
  # `src/healthcare-core/events.ts` — the canonical vocabulary is renal- and
  # payer-shaped — so the honest move is to map this specialty's facts onto the
  # generic events that exist rather than to invent types the platform cannot
  # carry. A chemo cycle is `medication.ordered`; an infusion is
  # `procedure.performed`; a tumour board is `encounter.summary`; a diagnosis is
  # `condition.recorded`.
  event_contracts:
    - types: [condition.recorded, medication.ordered, procedure.performed, encounter.summary, vital.observed]

  workflows:
    - id: oncology.treatment-plan
      events: [condition.recorded, medication.ordered]
    - id: oncology.cycle-tracking
      events: [medication.ordered, procedure.performed, encounter.summary]
    - id: oncology.toxicity-review
      events: [encounter.summary, vital.observed]

  measures:
    - id: eom:toxicity-monitoring
      cms_id: cms:enhancing-oncology-model

  ui_lens:
    id: oncology
    label: Oncology
    # A view by KIND plus the route its data comes from. This is the whole of G5:
    # the shell draws it because it has a `ranked-actions` renderer, not because
    # anyone added a `case` arm for `oncology-regimen`.
    views:
      - { id: oncology-regimen, label: Regimen review, kind: ranked-actions, source: /admin/swarm/oncology/board }
    terminology:
      patient: Person under treatment
      patient-plural: People under treatment
      patient-view: Treatment intelligence
      episode: Treatment plan
      session: Treatment visit
      program: Clinical pathway
      synthetic-data: Synthetic oncology data
      status-line: 5 ontology concepts · 3 workflows · 1 measure
