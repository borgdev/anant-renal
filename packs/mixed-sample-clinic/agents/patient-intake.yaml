id: patient-intake
version: 1.0.0
packId: mixed-sample-clinic
displayName: Patient Intake
description: Ingest a Patient record with governance and PHI handling.
scope: facility
trigger:
  kind: event
  eventType: patient.received
inputs:
  patient_id:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact ref
plan:
  type: sequence
  children:
    - type: step
      step:
        id: step-1
        skill: http.call
        inputs: {}
        retry:
          maxAttempts: 3
          backoffMs: 500
    - type: step
      step:
        id: step-2
        skill: http.call
        inputs: {}
        retry:
          maxAttempts: 3
          backoffMs: 500
    - type: step
      step:
        id: step-3
        skill: http.call
        inputs: {}
        retry:
          maxAttempts: 3
          backoffMs: 500
governance:
  phiHandling: read-write
  purposeOfUse:
    - treatment
    - operations
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.05
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  archetype: record-steward
  source-entity: patient
