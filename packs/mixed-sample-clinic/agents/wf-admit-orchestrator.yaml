id: wf-admit-orchestrator
version: 1.0.0
packId: mixed-sample-clinic
displayName: ESRD Admit Workflow Orchestrator
description: Runs the ESRD Admit Workflow procedure end-to-end.
scope: facility
trigger:
  kind: manual
inputs:
  id:
    type: string
    required: true
    description: ESRD Admit Workflow identifier
outputs:
  resultRef:
    type: string
    description: Result artifact ref
plan:
  type: sequence
  children:
    - type: step
      step:
        id: step-1
        skill: http.call
        inputs: {}
        retry:
          maxAttempts: 3
          backoffMs: 500
    - type: step
      step:
        id: step-2
        skill: http.call
        inputs: {}
        retry:
          maxAttempts: 3
          backoffMs: 500
    - type: step
      step:
        id: step-3
        skill: http.call
        inputs: {}
        retry:
          maxAttempts: 3
          backoffMs: 500
    - type: step
      step:
        id: step-4
        skill: http.call
        inputs: {}
        retry:
          maxAttempts: 3
          backoffMs: 500
    - type: step
      step:
        id: step-5
        skill: http.call
        inputs: {}
        retry:
          maxAttempts: 3
          backoffMs: 500
governance:
  phiHandling: read
  purposeOfUse:
    - operations
  clearanceRequired: internal
  hitlGates:
    - afterStepId: step-4
      role: nephrologist
      slaMinutes: 30
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.05
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 60000
labels:
  archetype: procedure-runner
  source-entity: wf-admit
  hitl: "true"
