id: emergency-preparedness-drill
version: 1.0.0
packId: dialysis-deep
displayName: "Emergency Preparedness Drill Tracker"
description: >
  Schedules and documents CMS emergency preparedness drills.
scope: facility
trigger:
  kind: event
  eventType: quarterly.batch
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact
plan:
  type: sequence
  children:
    - type: step
      step:
        id: schedule-drill
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: compose-scenario
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: review-medical-director
        skill: hitl.approve
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: dialysis
  lifecycleStage: active-care
  domain: regulatory:ep
