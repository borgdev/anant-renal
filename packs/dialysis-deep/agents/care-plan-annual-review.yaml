id: care-plan-annual-review
version: 1.0.0
packId: dialysis-deep
displayName: "Care Plan Annual Review"
description: >
  Ensures POC review annually for stable + monthly for unstable.
scope: facility
trigger:
  kind: event
  eventType: monthly.batch
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact
plan:
  type: sequence
  children:
    - type: step
      step:
        id: query-status
        skill: sql.query
        inputs: {}
    - type: step
      step:
        id: plan-review
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: review-nephrologist
        skill: hitl.approve
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: dialysis
  lifecycleStage: active-care
  domain: regulatory
