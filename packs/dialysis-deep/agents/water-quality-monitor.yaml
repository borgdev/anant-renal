id: water-quality-monitor
version: 1.0.0
packId: dialysis-deep
displayName: "Water Quality Monitoring (AAMI)"
description: >
  Records water quality per AAMI/ISO 23500; flags out-of-range.
scope: facility
trigger:
  kind: event
  eventType: daily.batch
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact
plan:
  type: sequence
  children:
    - type: step
      step:
        id: pull-readings
        skill: sql.query
        inputs: {}
    - type: step
      step:
        id: evaluate-thresholds
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: notify-biomed
        skill: http.call
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: dialysis
  lifecycleStage: active-care
  domain: operations
