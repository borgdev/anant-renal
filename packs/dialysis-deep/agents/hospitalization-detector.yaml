id: hospitalization-detector
version: 1.0.0
packId: dialysis-deep
displayName: "Hospitalization Detector"
description: >
  Detects admission via ADT feed and pauses in-center schedule + notifies inpatient team.
scope: facility
trigger:
  kind: event
  eventType: adt.a01
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact
plan:
  type: sequence
  children:
    - type: step
      step:
        id: pull-adt
        skill: sql.query
        inputs: {}
    - type: step
      step:
        id: notify-inpatient
        skill: http.call
        inputs: {}
    - type: step
      step:
        id: pause-schedule
        skill: llm.call
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: dialysis
  lifecycleStage: transition-of-care
  domain: care-coordination
