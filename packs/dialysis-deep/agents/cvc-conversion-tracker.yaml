id: cvc-conversion-tracker
version: 1.0.0
packId: dialysis-deep
displayName: "CVC Conversion Tracker"
description: >
  Detects prolonged CVC use and drives conversion to AVF/AVG.
scope: facility
trigger:
  kind: event
  eventType: daily.batch
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact
plan:
  type: sequence
  children:
    - type: step
      step:
        id: query-catheters
        skill: sql.query
        inputs: {}
    - type: step
      step:
        id: plan-conversion
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: notify-vascular-surgery
        skill: http.call
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: dialysis
  lifecycleStage: active-care
  domain: quality:esrd-qip
