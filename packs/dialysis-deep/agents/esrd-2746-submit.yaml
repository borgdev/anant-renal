id: esrd-2746-submit
version: 1.0.0
packId: dialysis-deep
displayName: "ESRD 2746 (Death Notification) Submitter"
description: >
  Generates and submits CMS-2746 within 14 days of patient death.
scope: facility
trigger:
  kind: event
  eventType: patient.death
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact
plan:
  type: sequence
  children:
    - type: step
      step:
        id: pull-encounter
        skill: sql.query
        inputs: {}
    - type: step
      step:
        id: compose-form
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: submit-cms
        skill: http.call
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: dialysis
  lifecycleStage: inactive
  domain: regulatory
