id: esrd-2744-annual
version: 1.0.0
packId: dialysis-deep
displayName: "ESRD 2744 (Annual Facility Survey) Compiler"
description: >
  Compiles and files CMS-2744 annual facility survey.
scope: facility
trigger:
  kind: event
  eventType: annual.reporting
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact
plan:
  type: sequence
  children:
    - type: step
      step:
        id: pull-census
        skill: sql.query
        inputs: {}
    - type: step
      step:
        id: compose-form
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: review-medical-director
        skill: hitl.approve
        inputs: {}
    - type: step
      step:
        id: submit-cms
        skill: http.call
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: dialysis
  lifecycleStage: active-care
  domain: regulatory
