id: dialysis-provider
version: 0.3.0
extends:
  - id: healthcare-core
    version_range: ^0.2.0
applies_to:
  organization_kinds: [provider, health-system]
  facility_kinds: [outpatient-dialysis, home-dialysis]
capabilities:
  - treatment-operations
  - missed-treatment-recovery
  - scheduling-recovery
  - hospitalization-transition
  - lab-review
  - vascular-access-surveillance
  - nutrition-dry-weight
  - medication-management
  - protocol-compliance
  - transport-barrier
  - qapi
  - qapi-evidence-packet
  - esrd-quality-reporting
cms_universe:
  # The ids are namespaced (`cms:<program>`), and they are the SAME strings the
  # TypeScript descriptor resolves. The manifest previously spelled one of them
  # `esrd-qip`, which could never match `cms:esrd:qip` — so a measure bound to
  # its declared authority silently bound to nothing.
  - id: cms:esrd:cfc:494
    title: ESRD Conditions for Coverage
    authority: CMS
  - id: cms:esrd:qip
    title: ESRD Quality Incentive Program
    authority: CMS
  - id: cms:esrd:pps
    title: ESRD Prospective Payment System
    authority: CMS
  - id: cms:nhsn-linkage
    title: CDC NHSN Dialysis Event
    authority: CDC
required_controls:
  - access-policy
  - audit-provenance
  - data-quality
  - simulation-suite
  - observability-dashboard
  - qapi-plan
  - break-glass-ledger

# ── specialty surface (platform contract v1) ────────────────────────────────
#
# Every artifact below is checked to RESOLVE: the named module must exist under
# packs/dialysis-provider/, every subscribed event must be declared above it,
# and every CMS-bound measure must name an authority this pack declared. A
# declaration that cannot be resolved is a failure, not an aspiration — see
# src/control-plane/pack-manifest.ts.
specialty:
  ontology:
    id: dialysis
    version: 1.0.0
    module: ontology.ts
    concepts:
      - dialysis.patient
      - dialysis.facility
      - dialysis.treatment
      - dialysis.chair
      - dialysis.shift
      - dialysis.vascular-access
      - dialysis.lab-result
      - dialysis.prescription
      - dialysis.hospitalization
      - dialysis.transport-barrier
      - dialysis.staff
      - dialysis.case

  event_contracts:
    # The canonical types this specialty both emits and consumes. They belong to
    # the substrate's vocabulary (src/healthcare-core/events.ts) — a specialty
    # reacting to a platform fact is the point, and declaring which ones it
    # touches is what makes its workflow subscriptions checkable.
    - module: index.ts
      types:
        - treatment.scheduled
        - treatment.completed
        - treatment.missed
        - treatment.shortened
        - treatment.cancelled
        - schedule.changed
        - lab.result-arrived
        - hospitalization.admitted
        - hospitalization.discharged
        - hospitalization.transfer
        - transport.issue
        - contact.attempted
        - contact.failed
        - vital.observed

  workflows:
    - id: dialysis.missed-treatment
      module: missed-treatment/state-machine.ts
      events: [treatment.missed, contact.attempted, contact.failed, transport.issue]
    - id: dialysis.schedule-recovery
      module: scheduling/index.ts
      events: [treatment.missed, treatment.scheduled, schedule.changed]
    - id: dialysis.hospitalization-transition
      module: hospitalization/index.ts
      events: [hospitalization.admitted, hospitalization.discharged, hospitalization.transfer]
    - id: dialysis.lab-review
      module: labs/index.ts
      events: [lab.result-arrived]

  measures:
    - id: esrd-qip:ktv
      module: measures/esrd-qip.ts
      cms_id: cms:esrd:qip

  ui_lens:
    id: renal
    label: Renal
    # The views this lens surfaces, in display order. The shell renders what the
    # ACTIVE lens declares instead of every view that happens to exist, which is
    # what stops a dialysis protocol strip appearing on a payer console.
    views:
      - { id: protocols, label: Cockpit }
      - { id: anemia, label: Anemia & ESA }
      - { id: adequacy, label: Adequacy & Kt/V }
      - { id: fluid, label: Fluid & IDH }
      - { id: vascular-access, label: Vascular access }
      - { id: mbd, label: CKD-MBD }
      - { id: nutrition, label: Nutrition & electrolytes }
      - { id: infection, label: Infection & vaccination }
      - { id: protocol-assurance, label: Cross-pack assurance }
      - { id: next-session, label: Next session }
      - { id: round-digest, label: Since your last round }
    # Terminology only for navigation: the shell already renders the navigation;
    # a lens renames what the operator reads, and inventing nav ids here would
    # be a claim about a UI that does not exist yet. Keys are shell slots, and
    # a lens declares only the ones it renames.
    terminology:
      patient: Patient
      patient-plural: Patients
      patient-view: Patient intelligence
      episode: Treatment cycle
      session: Dialysis session
      program: Quality program
      synthetic-data: Synthetic patient data
      status-line: 12 cells · 14 policies · 8 verified sources
