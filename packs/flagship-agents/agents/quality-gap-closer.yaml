id: quality-gap-closer
version: 1.0.0
packId: flagship-agents
displayName: "Quality Gap Closer"
description: >
  At encounter close, identifies open CMS quality gaps (mammography, colonoscopy, HbA1c, BP, tobacco cessation, immunizations); orders / books closure.
scope: facility
trigger:
  kind: event
  eventType: encounter.closed
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact reference
plan:
  type: sequence
  children:
    - type: step
      step:
        id: compute-gaps
        skill: sql.query
        inputs: {}
    - type: step
      step:
        id: draft-orders
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: clinician-review
        skill: hitl.approve
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
    - unit: hitl.minutes
      priceUsdPerUnit: 0.05
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: primary-care
  lifecycleStage: active-care
