id: insurance-eligibility-check
version: 1.0.0
packId: flagship-agents
displayName: "Insurance Eligibility Check (270/271)"
description: >
  Runs a real-time 270 eligibility inquiry against the payer and returns benefits summary + copay/deductible/coinsurance for the planned service.
scope: facility
trigger:
  kind: event
  eventType: referral.received
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact reference
plan:
  type: sequence
  children:
    - type: step
      step:
        id: build-270
        skill: x12.build.270
        inputs: {}
    - type: step
      step:
        id: send-270
        skill: http.call
        inputs: {}
    - type: step
      step:
        id: parse-271
        skill: llm.call
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
    - unit: hitl.minutes
      priceUsdPerUnit: 0.05
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: any
  lifecycleStage: pre-registration
