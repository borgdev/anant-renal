id: rejection-surveillance
version: 1.0.0
packId: flagship-agents
displayName: "Rejection Surveillance"
description: >
  Detects rising creatinine, new DSA, protocol biopsy due; opens biopsy pathway; alerts transplant nephrology.
scope: facility
trigger:
  kind: event
  eventType: lab.resulted
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact reference
plan:
  type: sequence
  children:
    - type: step
      step:
        id: detect-signals
        skill: sql.query
        inputs: {}
    - type: step
      step:
        id: open-biopsy-pathway
        skill: http.call
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
    - unit: hitl.minutes
      priceUsdPerUnit: 0.05
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: transplant-center
  lifecycleStage: post-transplant
