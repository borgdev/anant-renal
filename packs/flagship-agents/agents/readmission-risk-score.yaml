id: readmission-risk-score
version: 1.0.0
packId: flagship-agents
displayName: "30-day Readmission Risk Score"
description: >
  Computes LACE + HOSPITAL + CMS SRR-style risk; if high, enrolls patient in intensive post-discharge outreach agent chain.
scope: facility
trigger:
  kind: event
  eventType: discharge.completed
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact reference
plan:
  type: sequence
  children:
    - type: step
      step:
        id: pull-features
        skill: sql.query
        inputs: {}
    - type: step
      step:
        id: score-model
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: enroll-outreach
        skill: agent.invoke
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
    - unit: hitl.minutes
      priceUsdPerUnit: 0.05
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: inpatient
  lifecycleStage: transition-of-care
