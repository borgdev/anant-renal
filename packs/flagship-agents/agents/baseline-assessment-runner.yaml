id: baseline-assessment-runner
version: 1.0.0
packId: flagship-agents
displayName: "Baseline Assessment Runner"
description: >
  Administers PHQ-9, AUDIT-C, SDOH 5-domain, Morse, Katz ADL as applicable to the setting; stores in longitudinal record.
scope: facility
trigger:
  kind: event
  eventType: patient.arrived
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact reference
plan:
  type: sequence
  children:
    - type: step
      step:
        id: select-instruments
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: run-assessments
        skill: http.call
        inputs: {}
    - type: step
      step:
        id: score-and-file
        skill: sql.query
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
    - unit: hitl.minutes
      priceUsdPerUnit: 0.05
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: any
  lifecycleStage: onboarding
