id: discharge-medication-reconciliation
version: 1.0.0
packId: flagship-agents
displayName: "Discharge Medication Reconciliation"
description: >
  Reconciles home vs inpatient meds; produces patient-friendly discharge med list + clinician change summary + Meds-to-Beds pharmacy handoff.
scope: facility
trigger:
  kind: event
  eventType: discharge.ordered
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact reference
plan:
  type: sequence
  children:
    - type: step
      step:
        id: pull-lists
        skill: sql.query
        inputs: {}
    - type: step
      step:
        id: reconcile
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: clinician-approval
        skill: hitl.approve
        inputs: {}
    - type: step
      step:
        id: send-to-pharmacy
        skill: http.call
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
    - unit: hitl.minutes
      priceUsdPerUnit: 0.05
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: inpatient
  lifecycleStage: transition-of-care
