id: post-discharge-callback
version: 1.0.0
packId: flagship-agents
displayName: "Post-Discharge Symptom + Adherence Callback"
description: >
  Day+2 automated callback (voice + SMS + patient portal) for symptom check, med adherence, follow-up appointment confirmation; escalates to RN if concerning responses.
scope: facility
trigger:
  kind: event
  eventType: day+2
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact reference
plan:
  type: sequence
  children:
    - type: step
      step:
        id: compose-outreach
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: send-multi-channel
        skill: http.call
        inputs: {}
    - type: step
      step:
        id: rn-escalation
        skill: hitl.approve
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
    - unit: hitl.minutes
      priceUsdPerUnit: 0.05
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: any
  lifecycleStage: transition-of-care
