id: transplant-eval-orchestrator
version: 1.0.0
packId: flagship-agents
displayName: "Transplant Evaluation Orchestrator"
description: >
  Sequences cardiac clearance, dental, psychosocial, imaging, labs, PPD/vaccinations; tracks completion; assembles listing packet.
scope: facility
trigger:
  kind: event
  eventType: transplant.eval.ordered
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact reference
plan:
  type: sequence
  children:
    - type: step
      step:
        id: build-eval-plan
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: schedule-workup
        skill: http.call
        inputs: {}
    - type: step
      step:
        id: track-completion
        skill: sql.query
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
    - unit: hitl.minutes
      priceUsdPerUnit: 0.05
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: transplant-center
  lifecycleStage: transplant-workup
