id: opioid-limit-uc
version: 1.0.0
packId: urgent-care-deep
displayName: "Urgent Care Opioid Limit"
description: >
  Enforces 3-day-supply guardrail + PDMP check.
scope: facility
trigger:
  kind: event
  eventType: medication.prescribed:opioid
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact
plan:
  type: sequence
  children:
    - type: step
      step:
        id: pull-pdmp
        skill: sql.query
        inputs: {}
    - type: step
      step:
        id: plan-decision
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: notify-clinician
        skill: http.call
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: urgent-care
  lifecycleStage: active-care
  domain: medication-management
