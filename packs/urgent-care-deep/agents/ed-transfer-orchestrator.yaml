id: ed-transfer-orchestrator
version: 1.0.0
packId: urgent-care-deep
displayName: "ED Transfer Orchestrator (EMTALA)"
description: >
  Coordinates ED transfer per EMTALA + accepting-facility handoff.
scope: facility
trigger:
  kind: event
  eventType: transfer.ordered:ed
inputs:
  patientId:
    type: string
    required: true
    description: Patient identifier
outputs:
  resultRef:
    type: string
    description: Result artifact
plan:
  type: sequence
  children:
    - type: step
      step:
        id: pull-record
        skill: sql.query
        inputs: {}
    - type: step
      step:
        id: compose-summary
        skill: llm.call
        inputs: {}
    - type: step
      step:
        id: notify-receiving
        skill: http.call
        inputs: {}

governance:
  phiHandling: read-write
  purposeOfUse: [treatment, operations]
  clearanceRequired: phi
  hitlGates: []
  breakGlassAllowed: false
  evidenceRequired: []
billing:
  baseFeeUsd: 0.10
  meteredUnits:
    - unit: llm.tokens.input
      priceUsdPerUnit: 0.000003
    - unit: llm.tokens.output
      priceUsdPerUnit: 0.000015
    - unit: tool.call
      priceUsdPerUnit: 0.002
  budgetCapMonthlyUsd: 200
slas:
  p95LatencyMs: 30000
  maxCostUsd: 0.75
labels:
  setting: urgent-care
  lifecycleStage: transition-of-care
  domain: regulatory:emtala
