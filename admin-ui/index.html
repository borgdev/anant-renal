<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AnantHealth — Operator Console</title>
  <script>
    // Theme bootstrap — applied before first paint (avoids FOUC).
    (function () {
      try {
        // Theme — `data-theme` on <html> selects the token set in force. Both
        // sets declare the SAME variable names (see the tokens below), so the
        // switch is an attribute write and nothing downstream branches on it.
        var t = localStorage.getItem('hh-theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
        if (t !== 'light') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <style id="shell-base">
    /* =====================================================================
     * ANANTSTATE — the design tokens. The SAME names are declared in
     * exec-app/src/globals.css and exec-app/src/tailwind.css reads them, so a
     * colour is defined once and both consoles share one identity.
     *
     * Dark is the default (the engine room). `data-theme="light"` below
     * re-points the same names for the enterprise / executive reading surface,
     * so nothing downstream branches on the theme.
     * ===================================================================== */
    :root {
      color-scheme: dark;
      --fg: #F9FAFB; --muted: #9CA3AF; --faint: #97A0B0;
      --bg: #0A0D12; --bg-deep: #06080B;
      --card: #131822; --surface: #131822; --surface-2: #182029; --surface-3: #1E2632;
      --border: #1F2937; --line-strong: #2B3546;
      --brand: #00F2FE; --brand-2: #7C3AED; --accent: #7C3AED;
      --good: #10B981; --warn: #F59E0B; --bad: #F87171;
      --mint: #00F2FE; --mint-strong: #7DF9FF; --cyan: #00F2FE; --amber: #F59E0B; --rose: #F87171; --blue: #38BDF8; --violet: #7C3AED; --tint-blue: #7DD3FC;
      --code-bg: #0E131B; --code-fg: #CFFAFE;
      --primary-foreground: #0A0D12; --secondary: #182029; --secondary-foreground: #F9FAFB;
      --accent-foreground: #F9FAFB; --destructive-foreground: #0A0D12;
      --card-foreground: #F9FAFB; --popover: #131822; --popover-foreground: #F9FAFB;
      --ring: #00F2FE; --input: #2B3546; --radius: 0.25rem;
      --shadow: 0 18px 44px rgba(0,0,0,0.5);
      /* The embedded Renal Swarm Intelligence panel carries its own accent; it
         follows the theme rather than being an unrelated hue. */
      --partner-accent: #00F2FE; --partner-accent-soft: #A5F3FC;
      --danger-soft: #FCA5A5; --warn-soft: #FFCE8A;
      --scrim: rgba(6,9,14,0.68);
      /* Lifts and recesses: `.02` of white on obsidian, `.02` of ink on frost. */
      --elevate: #FFFFFF; --recess: #000000;
      /* Type — `--mono` is the engineered readout face (data, state keys, metrics),
         `--sans` is for prose. Plain stacks: no webfont request, no FOUT. */
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
    }
    /* =====================================================================
     * LIGHT — enterprise / executive reading surface. Same token names, so
     * every rule above applies unchanged; the accents move to the deeper
     * blue/indigo register that holds contrast on a bright background, where
     * teal and neon cannot.
     * ===================================================================== */
    :root[data-theme="light"] {
      color-scheme: light;
      --fg: #0F172A; --muted: #475569; --faint: #55606F;
      --bg: #F8FAFC; --bg-deep: #F1F5F9;
      --card: #FFFFFF; --surface: #FFFFFF; --surface-2: #F8FAFC; --surface-3: #F1F5F9;
      --border: #E2E8F0; --line-strong: #CBD5E1;
      /* Deep Infrastructure Blue, one shade deeper than the spec's #0284C7: at
         that value white-on-fill is 4.1:1 and blue-on-frost is 4.1:1, both under
         AA. #0369A1 gives 5.9:1 either way. Same reason for good/warn below. */
      --brand: #0369A1; --brand-2: #4F46E5; --accent: #4F46E5;
      --good: #065F46; --warn: #92400E; --bad: #B91C1C;
      --mint: #0369A1; --mint-strong: #075985; --cyan: #0369A1; --amber: #B45309; --rose: #DC2626; --blue: #0369A1; --violet: #4F46E5;
      --code-bg: #F1F5F9; --code-fg: #0F172A;
      --primary-foreground: #FFFFFF; --secondary: #F1F5F9; --secondary-foreground: #0F172A;
      --accent-foreground: #0F172A; --destructive-foreground: #FFFFFF;
      --card-foreground: #0F172A; --popover: #FFFFFF; --popover-foreground: #0F172A;
      --ring: #0369A1; --input: #CBD5E1; --radius: 0.25rem;
      --shadow: 0 10px 30px rgba(15,23,42,0.10);
      --partner-accent: #0369A1; --partner-accent-soft: #075985;
      --danger-soft: #B91C1C; --warn-soft: #B45309;
      --scrim: rgba(15,23,42,0.32);
      --elevate: #0F172A; --recess: #0F172A;
    }
    .dark { color-scheme: dark; }
    /* Monospace accent — metrics, counts, state keys and table headers, never
       prose (a sentence in monospace reads as broken, not engineered). */
    code, .num, .count, .kv .k, .kv-row .k, .catalog-count, .activity-time, th {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }
    th { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    /* Inside a FILLED control the surface is the accent, so `--muted` (tuned
       against the page background) is unreadable — e.g. the count in an active
       filter tab. Invert it there. */
    .btn-primary .muted, .btn.primary .muted, .tab.active .muted, .btn-primary .muted-count {
      color: color-mix(in srgb, var(--primary-foreground) 80%, transparent);
    }
    * { box-sizing: border-box; border-color: var(--border); }
    html, body { margin: 0; padding: 0; }
    body {
      /* Solid, noise-free foundation — a deterministic surface, not a gradient. */
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    a { color: var(--brand); text-decoration: none; }
    button, input, select, textarea { font: inherit; color: inherit; }
    code { font-family: "JetBrains Mono", "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; padding: 1px 6px; background: color-mix(in srgb, var(--brand) 10%, transparent); border-radius: 4px; }
    /* Shell layout — plain CSS so it renders even if the Tailwind CDN is slow/blocked. */
    .app { display: flex; width: 100%; min-height: 100vh; }
    .sidebar { width: 240px; flex: 0 0 240px; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 12px 10px; }
    .main-col { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 11px; color: var(--muted); background: var(--card); }
    .status-pill svg { width: 12px; height: 12px; }
    .admin-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--fg); cursor: pointer; font-size: 13px; }
    .admin-btn:hover { border-color: var(--brand); color: var(--brand); }
    .admin-btn svg { width: 15px; height: 15px; }
    /* Global header search (enterprise text search across the console) */
    .global-search { position: relative; flex: 1 1 300px; max-width: 520px; margin: 0 14px; display: flex; align-items: center; }
    .global-search > i { position: absolute; left: 10px; color: var(--muted); pointer-events: none; width: 14px; height: 14px; }
    .global-search input { width: 100%; height: 32px; padding: 0 12px 0 30px; border: 1px solid var(--input); border-radius: 8px; background: var(--card); color: var(--fg); font-size: 13px; }
    .global-search input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 22%, transparent); }
    .global-results { position: absolute; top: 38px; left: 0; right: 0; z-index: 70; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 14px 40px color-mix(in srgb, var(--recess) 30%, transparent); max-height: 420px; overflow: auto; padding: 6px; }
    .global-results .gs-group { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 10px 3px; }
    .global-results .gs-item { display: flex; flex-direction: column; gap: 1px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    .global-results .gs-item:hover { background: color-mix(in srgb, var(--brand) 10%, transparent); }
    .global-results .gs-title { font-size: 13px; }
    .global-results .gs-sub { font-size: 11px; color: var(--muted); }
    .global-results .gs-empty { padding: 12px; font-size: 13px; color: var(--muted); }
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab { padding: 7px 14px; border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab:hover { color: var(--fg); }
    .tab.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
    .theme-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--muted); cursor: pointer; }
    .theme-btn:hover { color: var(--fg); }
    .field-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
    .field > input, .field > select { height: 36px; padding: 0 10px; border-radius: 6px; font-size: 13px; color: var(--fg); border: 1px solid var(--input); background: var(--bg); }
    .field > input[type="checkbox"] { width: 16px; height: 16px; margin: 0; padding: 0; accent-color: var(--brand); }
    .field.checkbox { flex-direction: row; align-items: center; gap: 6px; height: 36px; }
    /* Realm management — split view + create modal */
    .rm-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; margin-bottom: 8px; background: var(--card); transition: border-color .15s, background .15s; }
    .rm-card:hover { border-color: var(--ring); }
    .rm-card.active { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 8%, transparent); }
    .rm-card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .rm-card-top code { font-size: 12px; }
    .rm-card-meta { font-size: 12px; margin-top: 4px; }
    .rm-card-time { font-size: 11px; margin-top: 2px; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-overlay { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--recess) 50%, transparent); padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 20px 50px color-mix(in srgb, var(--recess) 30%, transparent); max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .modal-header h3 { margin: 0; font-size: 15px; font-weight: 600; }
    .modal-close { border: none; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
    .modal-close:hover { color: var(--fg); }
    .modal-body { padding: 16px 18px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); }
    /* Reusable data grid (TanStack) */
    .dg { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .dg-toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .dg-search { position: relative; }
    .dg-search input { height: 30px; padding: 0 10px 0 28px; border: 1px solid var(--input); border-radius: 6px; background: var(--bg); color: var(--fg); font-size: 13px; min-width: 220px; }
    .dg-tools { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .dg-btn { height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--fg); cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .dg-btn:hover { border-color: var(--brand); color: var(--brand); }
    .dg-btn svg { width: 13px; height: 13px; }
    .dg-count { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .dg-wrap { overflow: auto; max-height: 540px; }
    .dg table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 100%; }
    .dg thead th { position: sticky; top: 0; z-index: 2; text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 8px 12px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--brand) 6%, var(--bg)); white-space: nowrap; }
    .dg thead th.dg-sortable { cursor: pointer; user-select: none; }
    .dg thead th.dg-sortable:hover { color: var(--fg); }
    .dg thead th .dg-arrow { display: inline-block; margin-left: 4px; color: var(--brand); font-size: 11px; }
    .dg tbody td { padding: 7px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .dg tbody tr:last-child td { border-bottom: none; }
    .dg tbody tr:hover { background: color-mix(in srgb, var(--brand) 4%, transparent); }
    .dg .dg-filter th { position: sticky; top: 33px; z-index: 1; padding: 4px 6px; background: var(--card); border-bottom: 1px solid var(--border); }
    .dg .dg-filter input { width: 100%; min-width: 60px; height: 26px; padding: 0 8px; border: 1px solid var(--input); border-radius: 5px; background: var(--bg); color: var(--fg); font-size: 12px; }
    .dg-empty { padding: 28px; text-align: center; color: var(--muted); }
    .dg .dg-sel-col input { width: 15px; height: 15px; accent-color: var(--brand); cursor: pointer; }
    .dg tbody tr.has-sel { background: color-mix(in srgb, var(--brand) 8%, transparent); }
    .dg-footer { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .dg-footer .dg-pageinfo { font-size: 12px; color: var(--muted); }
    .dg-panel { position: relative; }
    .dg-drop { position: absolute; top: 100%; right: 0; z-index: 40; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 30px color-mix(in srgb, var(--recess) 25%, transparent); padding: 8px; min-width: 180px; max-height: 320px; overflow: auto; display: none; }
    .dg-drop.open { display: block; }
    .dg-drop label { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 6px; cursor: pointer; }
    .dg-drop label:hover { background: color-mix(in srgb, var(--brand) 8%, transparent); }
    /* Patient lifecycle diagram */
    .lc-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .lc-stat { flex: 1 1 120px; min-width: 130px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; }
    .lc-stat-num { font-size: 22px; font-weight: 700; line-height: 1.1; }
    .lc-stat-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
    .lc-wrap { border: 1px solid var(--border); border-radius: 12px; background: var(--card); overflow: auto; max-height: 74vh; }
    .lc-toolbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .lc-hint { font-size: 12px; color: var(--muted); }
    .lc-tools { display: flex; gap: 6px; }
    .lc-btn { height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; }
    .lc-btn:hover { border-color: var(--brand); color: var(--brand); }
    .lc-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .lc-chip { display: inline-flex; align-items: center; gap: 6px; }
    .lc-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .lc-card { cursor: default; }
    .lc-card:hover rect { filter: drop-shadow(0 4px 10px color-mix(in srgb, var(--recess) 28%, transparent)); }
    .main { flex: 1 1 auto; min-width: 0; padding: 12px 14px; overflow-x: auto; }
    /* Tabbed section strip — groups a section's sub-pages into a horizontal tab bar */
    .page-tabs { display: flex; align-items: flex-end; gap: 2px; padding: 8px 14px 0; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: thin; }
    .page-tabs .tab { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--muted); border: 1px solid transparent; border-bottom: none; border-radius: 10px 10px 0 0; background: transparent; cursor: pointer; white-space: nowrap; transition: .15s; }
    .page-tabs .tab:hover { color: var(--fg); background: color-mix(in srgb, var(--brand) 6%, transparent); }
    .page-tabs .tab.active { color: var(--brand); background: var(--card); border-color: var(--border); }
    .page-tabs .tab svg { width: 15px; height: 15px; }
    .page-tabs .tab .count { font-size: 11px; color: var(--muted); padding: 0 6px; border-radius: 999px; background: var(--bg); }
    .page-tabs .tab.active .count { color: var(--brand); }
    /* Form + focus polish (works without Tailwind too) */
    ::placeholder { color: var(--muted); opacity: 0.65; }
    :focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
    input[type="checkbox"], input[type="radio"] { accent-color: var(--brand); }
    select { background: var(--card); }
    /* ---------- Dockable sidebar (docked / collapsed icon rail + flyout) ---------- */
    .sidebar { transition: width .18s ease, flex-basis .18s ease; }
    .sidebar.collapsed { width: 56px; flex: 0 0 56px; padding: 12px 6px; }
    .sidebar .brand { display: flex; align-items: center; gap: 8px; padding: 0 8px 14px; }
    .brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--brand); flex-shrink: 0; display: grid; place-items: center; color: var(--primary-foreground); }
    .brand-mark svg { width: 13px; height: 13px; }
    .brand h1 { font-size: 14px; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; }
    .brand .dock-toggle { margin-left: auto; width: 28px; height: 28px; }
    .sidebar.collapsed .brand { justify-content: center; padding-left: 0; padding-right: 0; }
    .sidebar.collapsed .brand h1 { display: none; }
    .sidebar.collapsed .brand .dock-toggle { display: none; }
    .nav-section { margin-top: 3px; }
    .nav-section .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 6px 10px 4px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; white-space: nowrap; }
    .nav-section .label:hover { color: var(--fg); }
    .nav-section .label .nav-caret { margin-left: auto; font-size: 9px; color: var(--muted); transition: transform .15s; }
    .nav-section.collapsed-items .label .nav-caret { transform: rotate(-90deg); }
    .nav-section.collapsed-items .nav-body { display: none; }
    .nav-item { display: flex; align-items: center; gap: 8px; border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; transition: background .12s, color .12s; position: relative; white-space: nowrap; }
    .nav-item:hover { background: color-mix(in srgb, var(--brand) 8%, transparent); }
    .nav-item.active { background: color-mix(in srgb, var(--brand) 15%, transparent); color: var(--brand); font-weight: 600; }
    .nav-item .count { margin-left: auto; font-size: 11px; color: var(--muted); padding: 0 6px; border-radius: 999px; background: var(--bg); }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .nav-item .nav-pin { opacity: 0; width: 14px; height: 14px; margin-left: 4px; color: var(--muted); cursor: pointer; flex-shrink: 0; transition: opacity .12s; }
    .nav-item:hover .nav-pin, .nav-item.pinned .nav-pin { opacity: .7; }
    .nav-item.pinned .nav-pin { color: var(--warn); }
    .nav-item.pinned .nav-pin:hover { opacity: 1; }
    .nav-pin svg { width: 14px; height: 14px; }
    /* Collapsed (icon rail) mode: icons centered; flyout on hover */
    .sidebar.collapsed .nav-section .label { justify-content: center; padding: 6px 0; font-size: 0; }
    .sidebar.collapsed .nav-section .label .nav-caret { display: none; }
    .sidebar.collapsed .nav-item { justify-content: center; padding: 7px 0; }
    .sidebar.collapsed .nav-item .nav-label, .sidebar.collapsed .nav-item .count { display: none; }

    const ktv = state.ktv_adequacy, phos = state.phosphate, anemia = state.anemia_severity, vitals = state.vitals_instability, risk = state.deterioration_risk;
    return {
      labs: { K: +(6.5 - 3 * ktv).toFixed(1), HGB: +(13 - 5 * anemia).toFixed(1), URR: Math.round(55 + 30 * ktv), PHOS: +(3.5 + 4 * phos).toFixed(1) },
      hr: Math.round(70 + 30 * vitals), spo2: Math.round(Math.min(100, Math.max(80, 98 - 8 * vitals))), risk: +risk.toFixed(3),
    };
  }
  window.__liquidForecast = async (fromState, steps, intervention) => {
    await ready;
    const sim = new WasmSimulation('dialysis', 'cfc', new Uint8Array(0), 1);
    sim.setResidualAlpha(0); // baseline-only until trained weights are promoted
    if (fromState && Object.keys(fromState).length) sim.forkFrom(JSON.stringify(fromState), 0);
    const ticks = JSON.parse(sim.forecast(steps, 1, JSON.stringify(intervention || [])));
    sim.free();
    return ticks.map(tk => ({ t: tk.t, state: tk.state, ...project(tk.state) }));
  };
</script>
<script type="module">
  // Reusable data grid — TanStack Table core (headless, vanilla) with sorting, filters,
  // pagination, column visibility, row selection, and CSV/JSON export. Exposed as window.__dataGrid.
  import {
    createTable, getCoreRowModel, getSortedRowModel, getFilteredRowModel,
    getPaginationRowModel, getFacetedRowModel, getFacetedUniqueValues,
  } from 'https://esm.sh/@tanstack/table-core@8.21.3';

  const fmt = (v) => (v === null || v === undefined || v === '') ? '—' : String(v);
  const escH = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  window.__dataGrid = (opts) => {
    const root = typeof opts.el === 'string' ? document.getElementById(opts.el) : opts.el;
    if (!root) return null;
    const pageSize = opts.pageSize ?? 10;
    const showSearch = opts.search !== false;
    const showFilters = opts.columnFilters !== false;
    const showExport = opts.export !== false;
    const showCols = opts.columnsToggle !== false;
    const enableReorder = opts.reorder !== false;
    const enableResize = opts.resize !== false;
    const selectable = !!opts.selectable;
    const empty = opts.empty ?? 'No records.';
    const stateKey = opts.stateKey || String(opts.el || 'grid');
    const DEFAULT_SIZE = 150;

    const cols = (opts.columns || []).map((c) => ({
      id: c.key,
      accessorKey: c.key,
      header: c.label || c.key,
      enableSorting: c.sortable !== false,
      enableColumnFilter: c.filter !== false,
      size: DEFAULT_SIZE,
      cell: c.render ? (info) => c.render(info.getValue(), info.row.original) : (info) => fmt(info.getValue()),
      meta: { align: c.align || 'left', hide: c.hide || false },
    }));
    // Opt-in row-selection column + bulk actions (see renderAudit for usage). Selection is
    // tracked manually (esm.sh's table-core build lacks getSelectedRowModel) keyed by row id.
    const rowIdOf = (d) => String(d[opts.idKey || 'id'] ?? JSON.stringify(d));
    let selected = {}; // rowId -> true
    const selColumn = selectable ? {
      id: '__sel', accessorKey: '__sel', header: '', enableSorting: false, enableColumnFilter: false, size: 44,
      // Key selection by the row's data id (same key select-all + bulk use) so row checkboxes stay in sync.
      cell: (info) => { const rid = rowIdOf(info.row.original); return `<input type="checkbox" class="dg-sel" data-row="${escH(rid)}" ${selected[rid] ? 'checked' : ''}>`; },
      meta: { align: 'center', hide: false },
    } : null;

    function loadGridState() {
      try { return JSON.parse(localStorage.getItem('dg:' + stateKey) || 'null'); } catch (_) { return null; }
    }
    function saveGridState() {
      try {
        const st = table.getState();
        localStorage.setItem('dg:' + stateKey, JSON.stringify({
          columnOrder: st.columnOrder || [],
          columnVisibility: st.columnVisibility || {},
          sorting: st.sorting || [],
          columnSizing: st.columnSizing || {},
        }));
      } catch (_) { /* storage unavailable */ }
    }
    function clearGridState() {
      try { localStorage.removeItem('dg:' + stateKey); } catch (_) { /* ignore */ }
    }

    let saved = loadGridState();
    const makeTable = (data) => createTable({
      data: data || [],
      columns: selColumn ? [selColumn, ...cols] : cols,
      initialState: {
        sorting: [], globalFilter: '', columnFilters: [], columnVisibility: {}, columnSizing: {}, pagination: { pageIndex: 0, pageSize },
        ...(saved ? {
          columnOrder: saved.columnOrder || [],
          columnVisibility: saved.columnVisibility || {},
          sorting: saved.sorting || [],
          columnSizing: saved.columnSizing || {},
        } : {}),
      },
      getCoreRowModel: getCoreRowModel(),
      getSortedRowModel: getSortedRowModel(),
      getFilteredRowModel: getFilteredRowModel(),
      getPaginationRowModel: getPaginationRowModel(),
      ...(showFilters ? { getFacetedRowModel: getFacetedRowModel(), getFacetedUniqueValues: getFacetedUniqueValues() } : {}),
    });

    let table = makeTable(opts.data);
    function wireState() {
      // Every feature's state setter (table.setSorting/setGlobalFilter/…) routes through
      // its onXChange default (makeStateUpdater) → table.setState → options.onStateChange.
      // We handle ALL state in one place: write the new state into options.state (which
      // getState() reads) and re-render. Never call table.setX inside this handler, or
      // setX → onXChange → setX would recurse.
      table.setOptions((prev) => ({
        ...prev,
        // Start from the features' merged initialState so every slice (columnPinning,
        // columnSizing, expanded, …) exists; getHeaderGroups reads columnPinning.left/right.
        state: { ...table.initialState },
        onStateChange: (updater) => {
          const next = typeof updater === 'function' ? updater(table.options.state) : updater;
          table.setOptions((o) => ({ ...o, state: next }));
          render();
          saveGridState();
        },
      }));
    }
    wireState();

    let exportOpen = false;
    let colsOpen = false;
    let dragCol = null;

    function visibleCols() {
      return table.getAllLeafColumns().filter((c) => !c.columnDef.meta.hide);
    }
    function colWidth(col) {
      const st = table.getState();
      const w = st.columnSizing?.[col.id];
      return w ? `width:${w}px;max-width:${w}px;` : '';
    }

    function csv() {
      const c = visibleCols().filter((x) => x.getIsVisible());
      const rows = table.getFilteredRowModel().rows;
      const head = c.map((x) => x.id).join(',');
      const body = rows.map((r) => c.map((x) => {
        const v = r.getValue(x.id); const s = v === null || v === undefined ? '' : String(v);
        return '"' + s.replace(/"/g, '""') + '"';
      }).join(',')).join('\n');
      return head + '\n' + body;
    }
    function download(name, type, text) {
      const blob = new Blob([text], { type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function render() {
      const st = table.getState();
      const filtered = table.getFilteredRowModel().rows.length;
      const total = opts.data.length;
      const pageInfo = table.getPageCount() > 0 ? `page ${st.pagination.pageIndex + 1} of ${table.getPageCount()}` : 'page 1 of 1';
      const sel = `Showing ${filtered} of ${total}`;
      const selCount = selectable ? Object.keys(selected).filter((k) => selected[k]).length : 0;
      const bulkHTML = selectable && selCount > 0
        ? `<span class="dg-count">${selCount} selected</span>` + (opts.bulkActions || []).map((a, i) => `<button class="dg-btn" data-bulk="${i}">${escH(a.label)}</button>`).join('')
        : '';

      let head = '<tr>';
      for (const hg of table.getHeaderGroups()) {
        for (const h of hg.headers) {
          if (h.column.columnDef.meta.hide) continue;
          if (h.column.id === '__sel') {
            head += `<th class="dg-sel-col" style="width:44px;max-width:44px;text-align:center;"><input type="checkbox" class="dg-sel-all" title="Select all"></th>`;
            continue;
          }
          const sortable = h.column.getCanSort();
          const sorted = h.column.getIsSorted();
          const arrow = sorted === 'asc' ? '▲' : sorted === 'desc' ? '▼' : '';
          const w = colWidth(h.column);
          const cls = [sortable ? 'dg-sortable' : '', enableReorder && h.column.getCanSort() !== false ? 'dg-draggable' : ''].join(' ');
          head += `<th class="${cls}" data-col="${h.id}" ${enableReorder && h.column.getCanSort() !== false ? 'draggable="true"' : ''} style="text-align:${h.column.columnDef.meta.align};${w}">${escH(h.column.columnDef.header)}${arrow ? `<span class="dg-arrow">${arrow}</span>` : ''}${enableResize ? `<span class="dg-resizer" data-resize="${h.id}"></span>` : ''}</th>`;
        }
      }
      head += '</tr>';
      if (showFilters) {
        head += '<tr class="dg-filter">';
        for (const hg of table.getHeaderGroups()) for (const h of hg.headers) {
          if (h.column.columnDef.meta.hide) continue;
          if (h.column.id === '__sel') { head += '<th></th>'; continue; }
          const fv = h.column.getFilterValue();
          head += `<th data-fcol="${h.id}"><input placeholder="filter…" value="${escH(fv ?? '')}" ${h.column.getCanFilter() ? '' : 'disabled'}></th>`;
        }
        head += '</tr>';
      }

      const rows = table.getRowModel().rows;
      let body = '';
      if (rows.length === 0) {
        body = `<tr><td colspan="${visibleCols().filter((c) => c.getIsVisible()).length}" class="dg-empty">${escH(empty)}</td></tr>`;
      } else {
        for (const r of rows) {
          body += '<tr>';
          for (const c of r.getVisibleCells()) {
            if (c.column.columnDef.meta.hide) continue;
            // renderValue() returns the raw value; to honor custom cell renderers
            // (pills, buttons, code, …) we must invoke the column's cell fn ourselves.
            const cellFn = c.column.columnDef.cell;
            const v = cellFn ? cellFn(c.getContext()) : c.renderValue();
            body += `<td style="text-align:${c.column.columnDef.meta.align};${colWidth(c.column)}">${v === null || v === undefined ? '—' : v}</td>`;
          }
          body += '</tr>';
        }
      }

      // Preserve focus/selection across re-render so typing in search/filter keeps working.
      const focusId = document.activeElement && root.contains(document.activeElement) ? document.activeElement.id : null;
      const focusSel = focusId && document.activeElement && document.activeElement.tagName === 'INPUT' ? document.activeElement.selectionStart : null;
      root.innerHTML = `
        <div class="dg">
          ${showSearch || showExport || showCols || opts.reset !== false ? `<div class="dg-toolbar">
            ${showSearch ? `<div class="dg-search"><input id="${opts.el}-q" placeholder="Search…" value="${escH(st.globalFilter ?? '')}"></div>` : ''}
            ${enableReorder ? `<span class="dg-reorder-hint" title="Drag column headers to reorder">⇄ drag</span>` : ''}
            <div class="dg-tools">
              <span class="dg-count">${sel}</span>
              ${bulkHTML}
              <select id="${opts.el}-size" class="dg-btn" title="Page size">
                ${[10, 25, 50, 100].map((n) => `<option value="${n}" ${st.pagination.pageSize === n ? 'selected' : ''}>${n}/page</option>`).join('')}
              </select>
              ${showExport ? `<span class="dg-panel">
                <button class="dg-btn" id="${opts.el}-export">Export ▾</button>
                <div class="dg-drop" id="${opts.el}-expdrop"><button class="dg-btn" data-exp="csv" style="width:100%;justify-content:flex-start;">CSV</button><button class="dg-btn" data-exp="json" style="width:100%;justify-content:flex-start;">JSON</button></div>
              </span>` : ''}
              ${showCols ? `<span class="dg-panel">
                <button class="dg-btn" id="${opts.el}-cols">Columns ▾</button>
                <div class="dg-drop" id="${opts.el}-coldrop">${visibleCols().map((c) => `<label><input type="checkbox" data-col="${c.id}" ${c.getIsVisible() ? 'checked' : ''}> ${escH(c.columnDef.header)}</label>`).join('')}</div>
              </span>` : ''}
              ${opts.reset !== false ? `<button class="dg-btn dg-reset" id="${opts.el}-reset" title="Reset column order / visibility / sizes">Reset ▸</button>` : ''}
            </div>
          </div>` : ''}
          <div class="dg-wrap"><table>
            <thead>${head}</thead>
            <tbody>${body}</tbody>
          </table></div>
          <div class="dg-footer">
            <button class="dg-btn" id="${opts.el}-prev" ${table.getCanPreviousPage() ? '' : 'disabled'}>‹ Prev</button>
            <span class="dg-pageinfo">${pageInfo}</span>
            <button class="dg-btn" id="${opts.el}-next" ${table.getCanNextPage() ? '' : 'disabled'}>Next ›</button>
          </div>
        </div>`;

      // ---- Row selection (opt-in via opts.selectable; manual selection tracking) ----
      if (selectable) {
        root.querySelectorAll('.dg-sel').forEach((cb) => cb.addEventListener('change', (e) => {
          selected[e.target.dataset.row] = e.target.checked;
          render();
        }));
        const all = root.querySelector('.dg-sel-all');
        if (all) {
          const allChecked = selCount > 0 && selCount === opts.data.length;
          all.indeterminate = selCount > 0 && !allChecked;
          all.checked = allChecked;
          all.addEventListener('change', (e) => {
            selected = {};
            if (e.target.checked) opts.data.forEach((d) => { selected[rowIdOf(d)] = true; });
            render();
          });
        }
        root.querySelectorAll('[data-bulk]').forEach((b) => b.addEventListener('click', () => {
          const a = (opts.bulkActions || [])[Number(b.dataset.bulk)];
          const rows = opts.data.filter((d) => selected[rowIdOf(d)]);
          if (a && rows.length) a(rows);
        }));
      }
      const q = document.getElementById(`${opts.el}-q`);
      if (q) q.addEventListener('input', (e) => table.setGlobalFilter(e.target.value));
      const size = document.getElementById(`${opts.el}-size`);
      if (size) size.addEventListener('change', (e) => table.setPageSize(Number(e.target.value)));
      const prev = document.getElementById(`${opts.el}-prev`);
      if (prev) prev.addEventListener('click', () => table.previousPage());
      const next = document.getElementById(`${opts.el}-next`);
      if (next) next.addEventListener('click', () => table.nextPage());
      const reset = document.getElementById(`${opts.el}-reset`);
      if (reset) reset.addEventListener('click', () => { clearGridState(); saved = null; table = makeTable(opts.data); wireState(); render(); toast('Grid view reset', 'good'); });
      root.querySelectorAll('th.dg-sortable').forEach((th) => th.addEventListener('click', (e) => {
        if (e.target.closest('.dg-resizer')) return; // resize handle click shouldn't sort
        const col = table.getColumn(th.dataset.col); if (col) col.toggleSorting();
      }));
      root.querySelectorAll('.dg-filter input').forEach((inp) => inp.addEventListener('input', (e) => {
        const th = inp.closest('th'); const col = table.getColumn(th.dataset.fcol); if (col) col.setFilterValue(e.target.value);
      }));
      // ---- Drag-to-reorder (HTML5 DnD on header cells) ----
      if (enableReorder) {
        root.querySelectorAll('th.dg-draggable').forEach((th) => {
          th.addEventListener('dragstart', (e) => {
            dragCol = th.dataset.col; th.classList.add('dg-dragging');
            try { e.dataTransfer.setData('text/plain', th.dataset.col); e.dataTransfer.effectAllowed = 'move'; } catch (_) { /* IE */ }
          });
          th.addEventListener('dragend', () => { th.classList.remove('dg-dragging'); root.querySelectorAll('th.dg-drag-over').forEach((x) => x.classList.remove('dg-drag-over')); dragCol = null; });
          th.addEventListener('dragover', (e) => { if (th.dataset.col !== dragCol) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; th.classList.add('dg-drag-over'); } });
          th.addEventListener('dragleave', () => th.classList.remove('dg-drag-over'));
          th.addEventListener('drop', (e) => {
            e.preventDefault(); th.classList.remove('dg-drag-over');
            const from = dragCol || (e.dataTransfer.getData('text/plain') || null);
            const to = th.dataset.col;
            if (!from || !to || from === to) return;
            const order = table.getAllLeafColumns().map((c) => c.id);
            const i = order.indexOf(from); const j = order.indexOf(to);
            if (i < 0 || j < 0) return;
            order.splice(i, 1); order.splice(j, 0, from);
            table.setColumnOrder(order);
          });
        });
      }
      // ---- Column resize (pointer drag on header resizer) ----
      if (enableResize) {
        root.querySelectorAll('.dg-resizer').forEach((handle) => {
          handle.addEventListener('pointerdown', (e) => {
            e.preventDefault(); e.stopPropagation();
            const th = handle.closest('th'); if (!th) return;
            const col = table.getColumn(th.dataset.col); if (!col) return;
            const startX = e.clientX; const startW = col.getSize();
            document.body.classList.add('dg-resizing');
            const onMove = (ev) => { const next = Math.max(48, startW + (ev.clientX - startX)); table.setColumnSizing((s) => ({ ...s, [col.id]: Math.round(next) })); };
            const onUp = () => { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); document.body.classList.remove('dg-resizing'); saveGridState(); };
            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onUp);
          });
        });
      }
      const exp = document.getElementById(`${opts.el}-export`);
      const expDrop = document.getElementById(`${opts.el}-expdrop`);
      if (exp) exp.addEventListener('click', (e) => { e.stopPropagation(); exportOpen = !exportOpen; if (expDrop) expDrop.classList.toggle('open', exportOpen); });
      if (expDrop) expDrop.addEventListener('click', (e) => {
        const b = e.target.closest('[data-exp]'); if (!b) return;
        if (b.dataset.exp === 'csv') download((opts.filename || 'export') + '.csv', 'text/csv', csv());
        else download((opts.filename || 'export') + '.json', 'application/json', JSON.stringify(table.getFilteredRowModel().rows.map((r) => r.original), null, 2));
        exportOpen = false; expDrop.classList.remove('open');
      });
      const cb = document.getElementById(`${opts.el}-cols`);
      const colDrop = document.getElementById(`${opts.el}-coldrop`);
      if (cb) cb.addEventListener('click', (e) => { e.stopPropagation(); colsOpen = !colsOpen; if (colDrop) colDrop.classList.toggle('open', colsOpen); });
      if (colDrop) colDrop.addEventListener('change', (e) => {
        const col = table.getColumn(e.target.dataset.col); if (col) col.toggleVisibility();
      });
      if (focusId) {
        const el = document.getElementById(focusId);
        if (el) { el.focus(); if (focusSel != null && typeof el.selectionStart === 'number') { try { el.setSelectionRange(focusSel, focusSel); } catch { /* ignore */ } } }
      }
      if (window.hydrateIcons) window.hydrateIcons();
    }

    render();
    return {
      refresh(data) { opts.data = data; selected = {}; table = makeTable(data); wireState(); render(); },
      table,
    };
  };
</script>
