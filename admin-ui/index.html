// Delegated row actions so they survive dataGrid re-renders (sort/filter/paginate).
function bindCrudActions(body, editFields) {
  body.addEventListener('click', (e) => {
    const del = e.target.closest('[data-del]');
    if (del) {
      const url = del.dataset.del;
      if (!confirm(`Delete ${url.split('/')[0].slice(0, -1)} '${decodeURIComponent(url.split('/').slice(1).join('/'))}'?`)) return;
      sh.req('DELETE', '/admin/settings/' + url).then(() => { toast('Deleted', 'good'); loadSettingsTab(); }).catch((err) => toast('Delete failed: ' + err.message, 'err'));
      return;
    }
    const edit = e.target.closest('[data-edit]');
    if (edit && editFields) editFields(JSON.parse(edit.dataset.edit));
  });
}

let simRefreshTimer = null;
function stopSimRefresh() { if (simRefreshTimer) { clearInterval(simRefreshTimer); simRefreshTimer = null; } }
// Live auto-refresh: while the Simulator view is active, poll /admin/simulator/status
// every 2s and update the counters/realm rows in place — no manual refresh needed.
function startSimRefresh() {
  stopSimRefresh();
  simRefreshTimer = setInterval(async () => {
    if (currentView !== 'simulator') { stopSimRefresh(); return; }
    let sim = null;
    try { const s = await simFetch('/admin/simulator/status'); sim = s.simulator || null; } catch (_) { return; }
    updateSimStatus(sim);
  }, 2000);
}
function updateSimStatus(sim) {
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('sim-stat-scenario', (sim && sim.scenario) || '—');
  set('sim-stat-pace', sim && sim.pace ? sim.pace.realmHoursPerTick + 'h' : '—');
  set('sim-stat-ticks', sim ? sim.tickCount : 0);
  set('sim-stat-events', sim ? sim.eventCount : 0);
  const t = (sim && sim.totals) || {};
  set('sim-stat-realms', t.realms || 0);
  set('sim-stat-patients', t.patients || 0);
  set('sim-stat-presences', t.presences || 0);
  set('sim-stat-effects', t.effects || 0);
  const pill = document.getElementById('sim-status-pill');
  if (pill) {
    const tone = { running: 'good', paused: 'warn', idle: 'muted' };
    const status = (sim && sim.status) || 'idle';
    pill.className = 'pill ' + (tone[status] || 'muted');
    pill.textContent = esc(status);
  }
  const rows = document.getElementById('sim-realm-rows');
  if (rows) rows.innerHTML = simRealmRowsHTML(sim && sim.realms);
  const running = sim && sim.status === 'running';
  const paused = sim && sim.status === 'paused';
  const b = (id, disabled) => { const el = document.getElementById(id); if (el) el.disabled = !!disabled; };
  b('sim-btn-start', running);
  b('sim-btn-pause', !running);
  b('sim-btn-resume', !paused);
  b('sim-btn-reset', !sim || sim.status === 'idle');
}
async function simAction(path, body, btn) {
  const prev = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Working…'; }
  try {
    await simFetch(path, { method: 'POST', body: JSON.stringify(body || {}) });
  } catch (e) {
    alert(e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = prev; }
    await renderSimulator();
  }
}

}

        ${p.status === 'reconciled' ? `<button class="btn btn-sm" onclick="wsSubAction('${p.id}','reconcile')">Reconcile</button>` : ''}

// Journey K lifecycle action (freeze/approve/submit/receipt/correct/reconcile).
window.wsSubAction = async function(id, action) {
  let payload = {};
  if (action === 'freeze') {
    const start = prompt('Evidence window start (YYYY-MM-DD):', `${new Date().getFullYear()}-01-01`);
    if (!start) return;
    payload = { start, end: prompt('Evidence window end (YYYY-MM-DD):', `${new Date().getFullYear()}-12-31`) || `${new Date().getFullYear()}-12-31`, by: 'regulatory-admin' };
  } else if (action === 'approve') {
    const approver = prompt('Class-D approver:', 'regulatory-admin');
    if (!approver) return;
    payload = { approver };
  } else if (action === 'receipt') {
    const status = prompt('CMS receipt status (accepted | rejected):', 'accepted');
    if (!status) return;
    payload = { status, referenceId: prompt('CMS reference id:', 'EQRS-2026-000001') || 'EQRS-2026-000001', message: prompt('Receipt message (optional):', '') || 'received' };
  } else if (action === 'correct') {
    const reason = prompt('Correction reason:', '');
    if (!reason) return;
    payload = { reason, by: 'quality-officer' };
  } else if (action === 'reconcile') {
    payload = { by: 'regulatory-admin' };
  } else if (action === 'submit') {
    payload = { by: 'regulatory-admin', credentialsPresent: confirm('Transmission credentials present? (Certified connector is checked server-side)') };
  }
  try {
    const j = await wsFetch(`/admin/platform/submissions/${id}/${action}`, { method: 'POST', body: JSON.stringify(payload) });
    if (action === 'submit' && j.stopped) toast('⛔ ' + j.reason, 'warn');
    else toast(`${action} → ${j.package?.status ?? 'ok'}`, 'good');
  } catch (e) { toast(e.message, 'bad'); }
  renderWsSubmissions();
};

function wsOntologyCard(key, cfg) {
  const rows = wsOntology[key] || [];

function wsOntologySet(key, idx, field, value) {

  else if (['facilities', 'patients'].includes(field)) wsOntology[key][idx][field] = Number(value) || 0;
  else wsOntology[key][idx][field] = value;
}
function wsOntologyAdd(key) {
  if (!wsOntology[key]) wsOntology[key] = [];
  const n = wsOntology[key].length + 1;
  const base = key === 'scopePath' ? { id: `node-${n}`, level: 'facility', label: '', facilities: 0, patients: 0 }
    : key === 'roles' ? { id: '', shortLabel: '', label: '', scopeLevel: 'facility', purpose: '', decisionRights: [] }

      { key: 'status', label: 'Status', render: (v) => `<span class="pill ${v === 'awaiting-approval' ? 'warn' : 'muted'}">${esc(v)}</span>` },
      { key: 'score', label: 'Score', align: 'right', render: (v) => Number(v).toFixed(3) },
    ],
    data: d?.nbas || [],
  });
}

async function renderSwarmEpisodes() {
  const dom = await consoleDomain();
  let episodes = [];
  try { const j = await api('GET', '/admin/swarm/episodes'); episodes = j.episodes || []; } catch (_) { /* offline */ }
  const statePill = (s) => `<span class="pill ${s === 'Resolved' ? 'good' : s === 'Escalated' || s === 'Blocked' ? 'bad' : s === 'AwaitingApproval' ? 'warn' : 'muted'}">${esc(s)}</span>`;
  main.innerHTML = `
    <div class="page-header"><div><h2 class="page-title">Outcome episodes</h2>
      <p class="page-sub">Durable coordination of evidence → proposal → approval → command → acknowledgement → verified result. Approve to issue an idempotent command; Ack to close with a measure result.</p></div></div>
    <div class="detail" style="margin-top:0;"><div class="field-row">
      <div class="field"><label>Kind</label><input id="se-kind" value="continuity.risk" style="width:160px"></div>
      <div class="field"><label>Subject</label><input id="se-subject" value="patient:p1" style="width:200px"></div>
      <div class="field"><label>Scope</label><select id="se-scope"><option>region</option><option>facility</option><option>market</option><option>patient</option></select></div>
      <button class="btn btn-primary" id="se-open"><i data-lucide="plus"></i> Open episode</button>
    </div></div>
    <div class="detail"><h3 style="margin-top:0;">Episodes (${episodes.length})</h3>
      <div id="swarm-episodes-list"></div>
    </div>`;
  const list = document.getElementById('swarm-episodes-list');
  const renderList = (eps) => {
    if (!list) return;
    list.innerHTML = eps.map((e) => `
      <div style="padding:7px 0;border-bottom:1px dashed var(--border);">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <code>${esc(e.episodeId)}</code> ${statePill(e.state)}
          <span class="muted" style="font-size:12px;">${esc(e.kind)} · ${esc(e.subject)}</span>
          ${e.measureResult ? `<span class="pill good">${esc(e.measureResult.measureId)} ${e.measureResult.met ? '✓' : '✗'}</span>` : ''}
          ${e.evidenceFusion && typeof e.evidenceFusion.belief === 'number' ? `<span class="pill muted" title="Dempster–Shafer evidence fusion · provenance">Bel ${Math.round(e.evidenceFusion.belief * 100)}% · Pl ${Math.round((e.evidenceFusion.plausibility ?? 0) * 100)}% · K ${Number(e.evidenceFusion.conflictMass ?? 0).toFixed(2)} · ${esc(e.evidenceStatus ?? 'fused')}</span>` : ''}
          <span class="muted" style="font-size:11px;">${e.transitions.length} transitions</span>
        </div>
        <div class="muted" style="font-size:11px;margin-top:2px;">${(e.transitions || []).map((t) => `${esc(t.from)} → ${esc(t.to)}`).join(' · ')}</div>
        <div style="display:flex;gap:6px;margin-top:4px;">
          ${['Observed', 'Watching', 'Understood'].includes(e.state) ? `<button class="btn btn-ghost" data-ep="${e.episodeId}" data-act="propose" style="padding:2px 10px;font-size:12px;">Prepare proposal</button>` : ''}
          ${e.state === 'AwaitingApproval' ? `<button class="btn btn-ghost" data-ep="${e.episodeId}" data-act="approve" style="padding:2px 10px;font-size:12px;">Approve</button><button class="btn btn-ghost" data-ep="${e.episodeId}" data-act="reject" style="padding:2px 10px;font-size:12px;">Reject</button>` : ''}
          ${e.state === 'Coordinating' ? `<button class="btn btn-ghost" data-ep="${e.episodeId}" data-act="ack" style="padding:2px 10px;font-size:12px;">Ack + verify</button>` : ''}
        </div>
      </div>`).join('') || '<div class="muted">No episodes — open one above.</div>';
    list.querySelectorAll('[data-ep]').forEach((b) => b.addEventListener('click', async () => {
      const id = b.dataset.ep; const act = b.dataset.act;
      if (act === 'propose') {
        const res = await fetch(`/admin/swarm/episodes/${id}/propose`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
        const j = await res.json();
        if (!res.ok) { toast(j.error || 'propose failed', 'err'); return; }
        toast('Proposal prepared — awaiting approval', 'good'); renderSwarmEpisodes();
        return;
      }
      const body = act === 'approve' ? { decision: 'approved', approver: 'AR · Regional operator', approvalClass: 'B' } : act === 'reject' ? { decision: 'rejected', approver: 'AR · Regional operator', approvalClass: 'B' } : { by: 'facility', measureId: dom.domainOptions.defaultMeasureId, met: true };
      const url = act === 'ack' ? `/admin/swarm/episodes/${id}/ack` : `/admin/swarm/episodes/${id}/decide`;
      const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      const j = await res.json();
      if (!res.ok) { toast(j.error || 'episode action failed', 'err'); return; }
      toast('Episode updated', 'good'); renderSwarmEpisodes();
    }));
  };
  renderList(episodes);
  document.getElementById('se-open')?.addEventListener('click', async () => {
    const res = await fetch('/admin/swarm/episodes', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind: document.getElementById('se-kind').value, subject: document.getElementById('se-subject').value, scopeType: document.getElementById('se-scope').value }) });
    const j = await res.json();
    if (!res.ok) { toast(j.error || 'open failed', 'err'); return; }
    toast('Episode opened', 'good'); renderSwarmEpisodes();
  });
}

async function renderPolicyReplay() {
  const d = await swarmDemoState();
  let current = 0.82;
  let min = 0.5, max = 0.99;
  try {
    const j = await (await fetch('/admin/swarm/admin/policy')).json();
    const pol = j && j.policy;
    if (pol && typeof pol.escalationThresholdBasisPoints === 'number') current = pol.escalationThresholdBasisPoints / 10000;
    if (pol && typeof pol.minThresholdBasisPoints === 'number') min = pol.minThresholdBasisPoints / 10000;
    if (pol && typeof pol.maxThresholdBasisPoints === 'number') max = pol.maxThresholdBasisPoints / 10000;
  } catch { /* fall back to the reference policy */ }
  main.innerHTML = `
    <div class="page-header"><div><h2 class="page-title">Policy replay · isolated sandbox</h2>
      <p class="page-sub">Change the escalation (consensus) threshold and replay persisted evidence to see what WOULD change — without mutating runtime state. Synthetic-by-default.</p></div></div>
    <div class="detail" style="margin-top:0;">
      <div class="field-row" style="align-items:flex-end;">
        <div class="field" style="flex:1;"><label>Escalation threshold — current policy ${Math.round(current * 100)}%</label>
          <input id="pr-threshold" type="range" min="${min}" max="${max}" step="0.01" value="${current}" style="width:100%;accent-color:var(--brand);">
        </div>
        <button class="btn btn-primary" id="pr-run"><i data-lucide="play"></i> Run what-if</button>
      </div>
      <div class="muted" style="font-size:12px;margin-top:6px;">Simulation is isolated — replaying never modifies runtime state.</div>
    </div>
    <div class="cards" id="pr-cards" style="grid-template-columns:repeat(4,1fr);">
      <div class="stat-card"><div class="num">—</div><div class="lbl">Episodes surfaced</div></div>
      <div class="stat-card"><div class="num">—</div><div class="lbl">Treatments protected</div></div>
      <div class="stat-card"><div class="num">—</div><div class="lbl">Human reviews required</div></div>
      <div class="stat-card"><div class="num">—</div><div class="lbl">Estimated value</div></div>
    </div>
    <div id="pr-out" class="muted" style="font-size:13px;margin-top:8px;">Move the slider and run the what-if.</div>`;
  const run = async () => {
    const threshold = Number(document.getElementById('pr-threshold').value);
    const res = await fetch('/admin/swarm/whatif', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ threshold }) });
    const j = await res.json();
    if (!res.ok) { toast(j.error || 'what-if failed', 'err'); return; }
    document.getElementById('pr-cards').innerHTML = `
      <div class="stat-card"><div class="num">${j.episodesSurfaced}</div><div class="lbl">Episodes surfaced</div></div>
      <div class="stat-card"><div class="num">${j.treatmentsProtected}</div><div class="lbl">Treatments protected</div></div>
      <div class="stat-card"><div class="num">${j.reviewsRequired}</div><div class="lbl">Human reviews required</div></div>
      <div class="stat-card"><div class="num">$${Number(j.estimatedValue).toLocaleString()}</div><div class="lbl">Estimated value</div></div>`;
    document.getElementById('pr-out').innerHTML = `<span class="pill good">simulation isolated</span> At threshold ${Math.round(threshold * 100)}%, ${j.episodesSurfaced} episode(s) surface — replay did not modify runtime state.`;
  };
  document.getElementById('pr-run')?.addEventListener('click', run);
  document.getElementById('pr-threshold')?.addEventListener('input', () => { const v = Number(document.getElementById('pr-threshold').value); document.getElementById('pr-out').textContent = `Threshold ${Math.round(v * 100)}% — run the what-if.`; });
}

// ---------- M-S3 release gate — green/red-team gating (deterministic) ----------
let releaseRedOverrides = {}; // red finding id → contained

async function renderReleaseGate() {
  main.innerHTML = `<div class="page-header"><div><h2 class="page-title">Release gate</h2>
    <p class="page-sub">Green/red-team gating before shipping a change to the governed swarm. Identical input always produces the same verdict.</p></div></div>
    <div class="muted" style="font-size:13px;">Loading gate…</div>`;
  const res = await fetch('/admin/swarm/release-gate');
  if (!res.ok) { main.innerHTML = `<div class="page-header"><div><h2 class="page-title">Release gate</h2></div></div><div class="state-card"><div class="state-title">Gate unavailable</div></div>`; return; }
  const { input, verdict } = await res.json();
  renderReleaseGateBody(input, verdict);
}

function renderReleaseGateBody(input, verdict) {
  const d = verdict.decision;
  const badge = d === 'ship' ? '<span class="pill good" style="font-size:13px;">SHIP</span>'
    : d === 'hold' ? '<span class="pill warn" style="font-size:13px;">HOLD</span>'
    : '<span class="pill err" style="font-size:13px;">BLOCK</span>';
  const c = input.change;
  const greenRows = (verdict.gates || []).map((g) => `
    <tr>
      <td><code>${esc(g.id)}</code></td>
      <td>${esc(g.plane)}</td>
      <td>${esc(g.check)}</td>
      <td><span class="pill ${g.status === 'pass' ? 'good' : g.status === 'warn' ? 'warn' : g.status === 'fail' ? 'err' : 'muted'}">${g.status}</span></td>
      <td class="muted" style="font-size:12px;">${esc(g.evidence)}</td>
    </tr>`).join('');
  // Initialize containment toggles from the returned red findings.
  (input.red || []).forEach((r) => { if (!(r.id in releaseRedOverrides)) releaseRedOverrides[r.id] = r.contained; });
  const redRows = (verdict.red || []).map((r) => {
    const contained = !!releaseRedOverrides[r.id];
    return `
      <tr>
        <td><code>${esc(r.id)}</code></td>
        <td>${esc(r.scenario)}</td>
        <td class="muted" style="font-size:12px;">${esc(r.detail)}</td>
        <td>
          <label class="field-row" style="align-items:center;gap:6px;">
            <input type="checkbox" data-red="${esc(r.id)}" ${contained ? 'checked' : ''}>
            <span class="${contained ? 'pill good' : 'pill err'}">${contained ? 'contained' : 'open'}</span>
          </label>
        </td>
      </tr>`;
  }).join('');
  main.innerHTML = `
    <div class="page-header"><div><h2 class="page-title">Release gate</h2>
      <p class="page-sub">Green/red-team gating before shipping a change to the governed swarm. Identical input always produces the same verdict.</p></div></div>
    <div class="cards" style="grid-template-columns:repeat(4,1fr);">
      <div class="stat-card"><div class="num">${badge}</div><div class="lbl">Decision</div></div>
      <div class="stat-card"><div class="num">${Math.round(verdict.score * 100)}%</div><div class="lbl">Gate score</div></div>
      <div class="stat-card"><div class="num">${verdict.greenScore * 100}%</div><div class="lbl">Green pass rate</div></div>
      <div class="stat-card"><div class="num">${verdict.redContained}/${verdict.redContained + verdict.redOpen}</div><div class="lbl">Red contained</div></div>
    </div>
    <div class="detail" style="margin-top:0;">
      <div class="field-row" style="justify-content:space-between;align-items:center;">
        <div style="font-weight:600;font-size:14px;">${esc(c.summary)}</div>
        <button class="btn btn-primary" id="rg-run"><i data-lucide="refresh-cw"></i> Re-run gate</button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;">
        <span class="pill muted">${esc(c.id)}</span>
        <span class="pill muted">${esc(c.changeType)}</span>
        <span class="pill muted">cells: ${(c.cellIds || []).map((x) => esc(x)).join(', ')}</span>
        <span class="pill ${verdict.sourcesCurrent ? 'good' : 'err'}">sources ${input.sources.current}/${input.sources.required}</span>
        <span class="pill ${verdict.approvalsMet ? 'good' : 'warn'}">approvals ${input.approvals.granted.length}/${input.approvals.required}</span>
      </div>
      ${verdict.blocks.length ? `<div class="muted" style="margin-top:8px;font-size:12px;">Blocking: ${verdict.blocks.map((b) => `<code>${esc(b)}</code>`).join(' ')}</div>` : ''}
      ${verdict.reasons.length ? `<div class="muted" style="margin-top:8px;font-size:12px;">Holding: ${verdict.reasons.map((b) => `<code>${esc(b)}</code>`).join(' ')}</div>` : ''}
    </div>
    <div class="detail">
      <div class="section-label">Green-team checks</div>
      <table class="table" style="width:100%;"><thead><tr><th>Check</th><th>Plane</th><th>What was verified</th><th>Status</th><th>Evidence</th></tr></thead><tbody>${greenRows}</tbody></table>
    </div>
    <div class="detail">
      <div class="section-label">Red-team findings — toggle containment then re-run</div>
      <table class="table" style="width:100%;"><thead><tr><th>Finding</th><th>Scenario</th><th>Detail</th><th>Contained</th></tr></thead><tbody>${redRows}</tbody></table>
    </div>`;
  document.querySelectorAll('[data-red]').forEach((el) => el.addEventListener('change', () => {
    releaseRedOverrides[el.dataset.red] = el.checked;
  }));
  document.getElementById('rg-run')?.addEventListener('click', async () => {
    const red = Object.keys(releaseRedOverrides).map((id) => ({ id, contained: !!releaseRedOverrides[id] }));
    const res = await fetch('/admin/swarm/release-gate/evaluate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ red }) });
    if (!res.ok) { toast('gate re-run failed', 'err'); return; }
    const j = await res.json();
    renderReleaseGateBody(j.input, j.verdict);
  });
}

// ---------- M-S3 kafka-bridge — outbox leasing + receipts / incidents ----------
async function renderBridge() {
  main.innerHTML = `<div class="page-header"><div><h2 class="page-title">Kafka bridge</h2>
    <p class="page-sub">The hosted worker terminates Kafka at authenticated HTTPS. The bridge leases outbox rows, validates integrity/tenant, publishes with an idempotent producer and records receipts or terminal incidents.</p></div></div>
    <div class="muted" style="font-size:13px;">Loading bridge…</div>`;
  await bridgeRefresh();
}

async function bridgeRefresh() {
  const res = await fetch('/admin/swarm/bridge');
  if (!res.ok) { main.innerHTML = `<div class="page-header"><div><h2 class="page-title">Kafka bridge</h2></div></div><div class="state-card"><div class="state-title">Bridge unavailable</div><div class="state-sub">No durable store wired to /admin/swarm/bridge.</div></div>`; return; }
  const { status } = await res.json();
  const c = status.counts || {};
  const o = status.outbox || {};
  const receiptRows = (status.receipts || []).map((r) => `
    <tr>
      <td><code>${esc(r.outboxId)}</code></td>
      <td><code>${esc(r.idempotencyKey)}</code></td>
      <td><span class="pill ${r.state === 'delivered' ? 'good' : 'err'}">${r.state}</span></td>
      <td class="muted" style="font-size:12px;">${r.incident ? esc(r.incident) : `${esc(r.topic)} · ${esc(r.partitionKey)}`}</td>
    </tr>`).join('') || '<tr><td colspan="4" class="muted">No receipts yet — seed the outbox and poll.</td></tr>';
  main.innerHTML = `
    <div class="page-header"><div><h2 class="page-title">Kafka bridge</h2>
      <p class="page-sub">The hosted worker terminates Kafka at authenticated HTTPS. The bridge leases outbox rows, validates integrity/tenant, publishes with an idempotent producer and records receipts or terminal incidents.</p></div></div>
    <div class="detail" style="margin-top:0;">
      <div class="field-row" style="justify-content:space-between;align-items:center;">
        <div style="font-size:13px;">Worker <code>${esc(status.workerId)}</code> · driver <span class="pill muted">${esc(status.driver)}</span></div>
        <div style="display:flex;gap:8px;">
          <button class="btn" id="br-seed"><i data-lucide="database-zap"></i> Seed outbox</button>
          <button class="btn btn-primary" id="br-poll"><i data-lucide="play"></i> Poll now</button>
        </div>
      </div>
      <div class="muted" style="font-size:12px;margin-top:4px;">One worker owns a row at a time (lease TTL). Publish is keyed by event id — the broker dedupes, so at-most-once delivery per row.</div>
    </div>
    <div class="cards" style="grid-template-columns:repeat(4,1fr);">
      <div class="stat-card"><div class="num">${o.pending}</div><div class="lbl">Outbox pending</div></div>
      <div class="stat-card"><div class="num">${c.receipts}</div><div class="lbl">Delivered receipts</div></div>
      <div class="stat-card"><div class="num">${c.activeLeases}</div><div class="lbl">Active leases</div></div>
      <div class="stat-card"><div class="num">${c.incidents}</div><div class="lbl">Terminal incidents</div></div>
    </div>
    <div class="detail">
      <div class="section-label">Bridge receipts / incidents</div>
      <table class="table" style="width:100%;"><thead><tr><th>Outbox row</th><th>Idempotency key</th><th>State</th><th>Detail</th></tr></thead><tbody>${receiptRows}</tbody></table>
    </div>`;
  document.getElementById('br-seed')?.addEventListener('click', async () => {
    const res = await fetch('/admin/swarm/bridge/seed', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
    const j = await res.json();
    if (!res.ok) { toast(j.error || 'seed failed', 'err'); return; }
    toast(`seeded ${j.seeded} canonical event(s)`, 'ok');
    bridgeRefresh();
  });
  document.getElementById('br-poll')?.addEventListener('click', async () => {
    const res = await fetch('/admin/swarm/bridge/poll', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
    const j = await res.json();
    if (!res.ok) { toast(j.error || 'poll failed', 'err'); return; }
    toast(`leased ${j.leased} · published ${j.published} · retrying ${j.retrying} · incidents ${j.incidents}`, 'ok');
    bridgeRefresh();
  });
}
